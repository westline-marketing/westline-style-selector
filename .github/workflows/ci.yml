name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pre-push hook's checks (`npm run preflight`): whitespace, typecheck, tests, build.
  # The first PR-time check in this repository; no ruleset requires it.
  preflight:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout is the merge commit, so HEAD^1 is the base tip.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Preflight
        run: npm run preflight -- --base HEAD^1
